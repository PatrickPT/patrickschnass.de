# Unit tests for the KI-Potenzial-Check: € model, pack validation and the mailer's validation.
name: Check tests

on:
  pull_request:
    paths: ["assets/check/**", "tests/**", "workers/**", ".github/workflows/check-tests.yml"]
  push:
    branches: [main]
    paths: ["assets/check/**", "tests/**", "workers/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/**/*.test.mjs"
